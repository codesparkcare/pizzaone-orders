<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Pizza One - PWA Configuration for iOS (Safari) and Android Chrome
    Deployed at: https://pizzaonerestaurant.com/apporder/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pizza One - Gestion des Commandes en temps réel. Tableau de bord des commandes pizza.">
  <meta name="keywords" content="pizza, commandes, restaurant, orders, management">
  <meta name="author" content="Pizza One Restaurant">

  <!-- ============================================================ -->
  <!--  iOS / Safari PWA Configuration (CRITICAL for iPhone/iPad)   -->
  <!-- ============================================================ -->

  <!-- Enables full-screen standalone mode when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Status bar style: black-translucent for immersive dark theme -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- App name shown under the icon on the Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Pizza One">

  <!-- Apple Touch Icons (REQUIRED for proper icon on iOS Home Screen) -->
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Apple Splash Screens (optional but improves launch experience) -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- ============================================================ -->
  <!--  Android / Chrome PWA Configuration                          -->
  <!-- ============================================================ -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF6B2B">
  <meta name="msapplication-TileColor" content="#0A0A0F">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Pizza One - Orders</title>

  <!-- ============================================================ -->
  <!--  Inline PWA Loading Styles                                   -->
  <!-- ============================================================ -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0A0A0F;
      overflow: hidden;
    }
    /* PWA Loading Screen */
    #pwa-loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #0A0A0F 0%, #1A0A00 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #pwa-loading.hidden { opacity: 0; pointer-events: none; }
    .pwa-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FF6B2B, #FF8C42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(255, 107, 43, 0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .pwa-title {
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .pwa-subtitle {
      color: rgba(255,255,255,0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .pwa-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,107,43,0.2);
      border-top-color: #FF6B2B;
      border-radius: 50%;
      margin-top: 30px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 107, 43, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 107, 43, 0.8); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* iOS PWA Install Banner (shown only in Safari, not standalone) */
    #ios-install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 107, 43, 0.4);
      border-radius: 16px;
      padding: 14px 18px;
      z-index: 10000;
      max-width: 340px;
      width: calc(100% - 40px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    #ios-install-banner .banner-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #ios-install-banner .banner-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FF6B2B, #FF8C42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    #ios-install-banner .banner-text { flex: 1; }
    #ios-install-banner .banner-text strong {
      display: block;
      color: #FFFFFF;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 700;
      margin-bottom: 3px;
    }
    #ios-install-banner .banner-text span {
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.4;
    }
    #ios-install-banner .banner-close {
      color: rgba(255,255,255,0.4);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .share-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      vertical-align: middle;
      fill: rgba(255,255,255,0.65);
    }
  </style>
</head>
<body>

  <!-- PWA Splash / Loading Screen -->
  <div id="pwa-loading">
    <div class="pwa-logo">🍕</div>
    <div class="pwa-title">PIZZA ONE</div>
    <div class="pwa-subtitle">Chargement en cours...</div>
    <div class="pwa-spinner"></div>
  </div>

  <!-- iOS Install Banner (Safari only, not shown in standalone mode) -->
  <div id="ios-install-banner" role="dialog" aria-label="Install Pizza One App">
    <div class="banner-inner">
      <div class="banner-icon">🍕</div>
      <div class="banner-text">
        <strong>Installer Pizza One</strong>
        <span>
          Appuyez sur
          <svg class="share-icon" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 2L9 8M15 2L21 8M15 2V20M7 14H3v14h24V14h-4" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          puis <strong style="color:#FF6B2B">"Sur l'écran d'accueil"</strong>
        </span>
      </div>
      <div class="banner-close" id="banner-close-btn" role="button" aria-label="Dismiss">✕</div>
    </div>
  </div>

  <!--
    Flutter bootstrap: the core app.
    See: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ================================================================
    //  PWA & iOS Safari Utilities
    // ================================================================

    // 1. Detect if running in iOS standalone (installed PWA) mode
    var isIosStandalone = (window.navigator.standalone === true);
    // Detect iOS Safari browser (not standalone)
    var isIosSafari = /iP(ad|hone|od)/.test(navigator.userAgent) &&
                      /WebKit/.test(navigator.userAgent) &&
                      !window.MSStream &&
                      !isIosStandalone;

    // 2. Show iOS Install Banner (only in Safari browser, not after install)
    var bannerDismissed = sessionStorage.getItem('pwa_banner_dismissed');
    if (isIosSafari && !bannerDismissed) {
      // Delay 3 seconds to show after initial content loads
      setTimeout(function() {
        var banner = document.getElementById('ios-install-banner');
        if (banner) banner.style.display = 'block';
      }, 3000);
    }

    // Close banner on dismiss button
    var closeBtn = document.getElementById('banner-close-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', function() {
        var banner = document.getElementById('ios-install-banner');
        if (banner) banner.style.display = 'none';
        sessionStorage.setItem('pwa_banner_dismissed', '1');
      });
    }

    // 3. iOS Audio Unlock: Safari blocks audio until user interaction.
    //    We pre-unlock the AudioContext on the first user touch/click
    //    so that order alert sounds play immediately when a new order arrives.
    var _audioUnlocked = false;
    function unlockAudio() {
      if (_audioUnlocked) return;
      _audioUnlocked = true;
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          var ctx = new AudioContext();
          var buf = ctx.createBuffer(1, 1, 22050);
          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
          // Resume in case browser auto-suspended it
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          console.log('[PizzaOne PWA] iOS Audio context unlocked successfully');
        }
      } catch(e) {
        console.warn('[PizzaOne PWA] Audio unlock failed:', e);
      }
      // Remove listeners after first interaction
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('touchend', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }

    // Attach audio unlock to first user interaction
    document.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
    document.addEventListener('touchend', unlockAudio, { passive: true, once: true });
    document.addEventListener('click', unlockAudio, { passive: true, once: true });

    // 4. Screen Wake Lock API – prevents iOS screen from sleeping.
    //    Activated by the Flutter app via window.pizzaWakeLock.enable()
    window.pizzaWakeLock = {
      _lock: null,
      _enabled: false,
      _supported: ('wakeLock' in navigator),

      enable: async function() {
        if (!this._supported) {
          console.warn('[WakeLock] Screen Wake Lock API not supported on this browser.');
          return false;
        }
        try {
          this._lock = await navigator.wakeLock.request('screen');
          this._enabled = true;
          console.log('[WakeLock] Screen wake lock acquired ✅');
          // Re-acquire lock when visibility changes (iOS releases lock when tab is hidden)
          document.addEventListener('visibilitychange', this._onVisibilityChange.bind(this));
          return true;
        } catch(e) {
          console.warn('[WakeLock] Failed to acquire wake lock:', e);
          return false;
        }
      },

      disable: function() {
        if (this._lock) {
          this._lock.release();
          this._lock = null;
        }
        this._enabled = false;
        console.log('[WakeLock] Screen wake lock released');
        document.removeEventListener('visibilitychange', this._onVisibilityChange.bind(this));
      },

      _onVisibilityChange: async function() {
        if (this._enabled && document.visibilityState === 'visible') {
          try {
            this._lock = await navigator.wakeLock.request('screen');
            console.log('[WakeLock] Screen wake lock re-acquired after visibility change ✅');
          } catch(e) {
            console.warn('[WakeLock] Re-acquire failed:', e);
          }
        }
      },

      isEnabled: function() {
        return this._enabled;
      },

      isSupported: function() {
        return this._supported;
      }
    };

    // 5. Visibility API – notify Flutter app when tab becomes visible again
    //    so it can immediately trigger a refresh (important for iOS background)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        console.log('[PizzaOne PWA] App became visible - triggering refresh');
        // Dispatch a custom event that Flutter can listen to
        window.dispatchEvent(new CustomEvent('pizzaone_app_visible'));
      }
    });

    // 6. Hide the loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('pwa-loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(function() {
          loading.style.display = 'none';
        }, 500);
      }
    });

    // Fallback: hide loading after 8 seconds regardless
    setTimeout(function() {
      var loading = document.getElementById('pwa-loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(function() { loading.style.display = 'none'; }, 500);
      }
    }, 8000);

    // 7. Register Firebase Messaging Service Worker for Web Push
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: '/apporder/' })
        .then(function(registration) {
          console.log('[PizzaOne PWA] Firebase SW registered:', registration.scope);
        })
        .catch(function(err) {
          console.warn('[PizzaOne PWA] Firebase SW registration failed:', err);
        });
    }
  </script>
</body>
</html>
